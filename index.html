<!DOCTYPE html>
<html>
<head>
    <title>Mi primera web</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #4CAF50;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <h1>Hola mundo web 🚀</h1>
    <p>Mi primera página creada con HTML</p>

    <button onclick="alert('¡Hola!')">
        Haz clic aquí
    </button>

</body>
</html>
