<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web</title>

    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #4CAF50;
            margin-top: 120px;
            animation: aparecer 1.5s ease-out;
        }

        p {
            animation: aparecer 2s ease-out;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Animación de entrada */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ❤️ Corazones flotando */
        .heart {
            position: absolute;
            bottom: -50px;
            color: #ff4d6d;
            font-size: 20px;
            animation: subir 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<h1>Dai te amo ❤️</h1>
<p>Esta página es para ti</p>

<button onclick="alert('¡Hola Dai ❤️!')">
    Haz clic aquí
</button>

<!-- Corazones -->
<div class="heart" style="left:10%; animation-duration:5s;">❤️</div>
<div class="heart" style="left:25%; animation-duration:7s;">❤️</div>
<div class="heart" style="left:40%; animation-duration:6s;">❤️</div>
<div class="heart" style="left:60%; animation-duration:8s;">❤️</div>
<div class="heart" style="left:80%; animation-duration:5.5s;">❤️</div>

</body>
</html>
