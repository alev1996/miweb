<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta para Dai ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0b1020, #2b0f1a);
    font-family: Arial;
    overflow: hidden;
}

/* 💌 CARTA */
.carta {
    width: 320px;
    height: 220px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    position: relative;
    z-index: 10; /* IMPORTANTE: encima de los corazones */
    transition: transform 0.4s;
}

.carta:hover {
    transform: scale(1.05);
}

.inicio {
    font-size: 18px;
    color: #333;
}

.mensaje {
    display: none;
    flex-direction: column;
    align-items: center;
    color: #333;
}

.abierta .inicio {
    display: none;
}

.abierta .mensaje {
    display: flex;
}

/* ❤️ corazones */
.heart {
    position: absolute;
    bottom: -50px;
    color: #ff4d6d;
    font-size: 20px;
    animation: subir 6s linear forwards;
    opacity: 0.8;
    pointer-events: none;
}

@keyframes subir {
    0% {transform: translateY(0); opacity: 0;}
    20% {opacity: 1;}
    100% {transform: translateY(-110vh); opacity: 0;}
}
</style>
</head>

<body>

<div class="carta" onclick="abrirCarta(this)">
    <div class="inicio">💌 Haz clic para abrir la carta</div>

    <div class="mensaje">
        <h2 style="color:#e91e63; margin:0;">Dai ❤️</h2>
        <p>Te amo mucho 💖</p>
        <p>Esta página es para ti ✨</p>
    </div>
</div>

<script>
function abrirCarta(carta) {
    carta.classList.add("abierta");
}

// ❤️ corazones infinitos
function crearCorazon() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 20) + "px";
    heart.style.animationDuration = (4 + Math.random() * 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
}

setInterval(crearCorazon, 300);
</script>

</body>
</html>
