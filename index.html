<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web</title>

    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #4CAF50;
            margin-top: 120px;
        }

        p {
            opacity: 0.9;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #45a049;
        }

        /* ❤️ Corazones */
        .heart {
            position: absolute;
            bottom: -50px;
            color: #ff4d6d;
            font-size: 20px;
            animation: subir 6s linear forwards;
            opacity: 0.8;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<h1>Dai te amo ❤️</h1>
<p>Esta página es para ti</p>

<button onclick="alert('¡Hola Dai ❤️!')">
    Haz clic aquí
</button>

<script>
    function crearCorazon() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";

        // posición aleatoria
        heart.style.left = Math.random() * 100 + "vw";

        // tamaño aleatorio
        heart.style.fontSize = (16 + Math.random() * 20) + "px";

        // duración aleatoria
        heart.style.animationDuration = (4 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        // eliminar después de la animación
        setTimeout(() => {
            heart.remove();
        }, 7000);
    }

    // crear corazones cada 300ms
    setInterval(crearCorazon, 300);
</script>

</body>
</html>
