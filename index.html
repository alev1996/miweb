<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera web</title>

    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        /* Animación del título */
        h1 {
            color: #4CAF50;
            animation: aparecer 1.5s ease-out;
        }

        p {
            animation: aparecer 2s ease-out;
        }

        /* Botón */
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 8px;

            /* animación de pulso */
            animation: pulse 2s infinite;
        }

        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        /* Animación de entrada */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animación de latido */
        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.5);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 15px rgba(76, 175, 80, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(76, 175, 80, 0);
            }
        }
    </style>
</head>

<body>

<h1>Dai te amo ❤️</h1>
<p>Esta página es para ti</p>

<button onclick="alert('¡Hola Dai ❤️!')">
    Haz clic aquí
</button>

</body>
</html>
